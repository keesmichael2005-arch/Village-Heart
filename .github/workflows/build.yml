# Runs on every push/PR: build, unit tests, in-world GameTests, and client GameTests
# (real game on a virtual display). Screenshots are uploaded as an artifact.
name: verify
on: [pull_request, push]

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - name: install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: verify (layers 1, 2, 4)
        env:
          JAVA_HOME_25: ${{ env.JAVA_HOME }}
        run: scripts/verify.sh
      - name: job summary
        if: always()
        run: cat reports/verify-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: village-heart-jar
          path: build/libs/village-heart-*[0-9].jar
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-reports
          path: |
            reports/
            build/libs/
