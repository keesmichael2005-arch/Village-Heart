# Runs on every PR push, and on pushes to dev and main (one run per push, not two): build, unit tests, in-world GameTests, and client GameTests
# (real game on a virtual display). Screenshots are uploaded as an artifact.
# The mod jar is uploaded only for pushes to dev and main: PRs are checked, not packaged.
# A newer push cancels the older run on the same ref (except main), so a batch merge into dev
# leaves one run, on the final commit, as the one to play.
name: verify
on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - name: install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: verify (layers 1, 2, 4)
        env:
          JAVA_HOME_25: ${{ env.JAVA_HOME }}
        run: scripts/verify.sh
      - name: job summary
        if: always()
        run: cat reports/verify-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        with:
          name: village-heart-jar
          path: build/libs/village-heart-*[0-9].jar
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-reports
          path: reports/
