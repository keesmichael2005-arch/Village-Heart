plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = "village-heart"
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"villageheart" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Fabric's test harness: creates the `gametest` source set plus
//   ./gradlew runGameTest        -> headless server, in-world tests (layer 2)
//   ./gradlew runClientGameTest  -> real client, scripted + screenshots (layer 4)
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "villageheart-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

// Layer 3: a real dedicated server running the gametest source set (the simulation harness), driven by
// scripts/simulate.sh. The harness is a no-op unless -Dvillageheart.sim.request is set. Must come AFTER the
// fabricApi block: sourceSets.gametest does not exist before it.
loom {
	runs {
		simulation {
			server()
			name "Simulation"
			source sourceSets.gametest
			runDir "build/run/sim"
			property "villageheart.sim.request", file("build/run/sim/sim-request.json").absolutePath
			vmArg "-Xmx3G"
			programArgs "--nogui"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Layer 1: plain unit tests for the village "brain" (no Minecraft needed)
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging { events "failed"; exceptionFormat "full" }
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
